[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dicom-file-modifier"
version = "0.1.0"
description = "Research toolkit for DICOM RT: RTSTRUCT analysis, rigid CT + RTSTRUCT transforms and dose indices (CI, GI, HI). Not a medical device."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dicom-file-modifier contributors" }]
keywords = ["dicom", "radiotherapy", "rtstruct", "rtdose", "medical physics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14",
    "pydicom>=3.0.1,<4",
    "shapely>=2.1,<3",
    "matplotlib>=3.10,<4",
    "scikit-image>=0.25",
    "plotly>=6.1,<7",
]

[project.scripts]
dfm = "dicom_file_modifier.cli:main"

[project.optional-dependencies]
gui = [
    "PySide6-Essentials>=6.10,<6.11",
    "pyqtgraph>=0.13.7",
]

[project.urls]
Repository = "https://github.com/TheOpenfield/dicom-file-modifier"

[dependency-groups]
test = ["pytest>=8"]
lint = ["ruff>=0.6"]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# bekannt und im Drift-Bericht dokumentiert (scikit-image 0.26 unter numpy 2.5)
filterwarnings = ["ignore:Setting the shape on a NumPy array:DeprecationWarning:skimage"]

[tool.hatch.build.targets.wheel]
packages = ["dicom_file_modifier"]

[tool.hatch.build.targets.sdist]
include = ["/dicom_file_modifier", "/tools", "/README.md", "/LICENSE"]
